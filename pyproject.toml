[project]
name = "health-mcp"
version = "0.1.0"
description = "Personal training and eating history, as an MCP server"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "anthropic>=0.40",
]

[project.scripts]
health-mcp = "health_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "time-machine>=2.16",
    "health-mcp[web]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
