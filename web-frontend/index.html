    <!--
    THESIS: Checking your own numbers should feel as calm and legible as reading a
    well-kept ledger, not scanning an instrument panel or wrestling a spreadsheet.
    OWN-WORLD: shadcn-vue "new-york" style — neutral zinc surfaces, a single emerald
    accent reserved for the primary action and on-target state, amber for estimated
    data and warnings, red for over-target and destructive actions only. Inter for
    every word, IBM Plex Mono for every measured number (kcal, grams, dates, kg).
    STORY: Daniel opens Today, sees four macro cards against target, stages foods
    into the meal he's building and commits it explicitly; flips to Trends to see
    weeks of intake and training laid side by side; asks Chat a direct question
    about his own data; flips a switch in Settings to let Hevy sync itself.
    FIRST VIEWPORT: four macro cards (2x2 on mobile, 4-across on desktop), a Catalog
    search field, and a quick-add list of recent foods below it.
    FORM: Ledger — a shadcn-vue redesign replacing the prior "Instrument Panel"
    cockpit build per /impeccable's 2026-09-01 request (comprehensive trends,
    Hevy sync toggle, embedded chat, shadcn-vue). The old cockpit visual identity
    is retired as evidence/anti-reference, not preserved; its behavioral rules
    (staged-then-confirmed writes, undo on every commit/delete) carry forward.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and an updated DESIGN.md.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
